<!DOCTYPE html><html><head><title>Minecraft Legal</title><style>body{margin:0;overflow:hidden}canvas{display:block}#info{position:fixed;top:10px;left:10px;color:#fff;background:#0008;padding:8px;font-family:sans-serif}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="info">CLICK TO PLAY - WASD move, SPACE jump, LEFT CLICK break, RIGHT CLICK place</div><script type="module">import*as THREE from'three';import{PointerLockControls}from'three/addons/controls/PointerLockControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer();renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const controls=new PointerLockControls(camera,document.body);document.body.addEventListener('click',()=>controls.lock());scene.add(new THREE.DirectionalLight(0xffffff,1));scene.add(new THREE.AmbientLight(0xffffff,0.6));const world={};function setBlock(x,y,z,c){let k=`${x},${y},${z}`;if(world[k])scene.remove(world[k]);if(!c){delete world[k];return;}let m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:c}));m.position.set(x+0.5,y+0.5,z+0.5);scene.add(m);world[k]=m;}for(let x=-15;x<15;x++)for(let z=-15;z<15;z++){setBlock(x,0,z,0x5aa82f);setBlock(x,-1,z,0x8B5A2B);setBlock(x,-2,z,0x888888);}let keys={};onkeydown=e=>keys[e.code]=1;onkeyup=e=>keys[e.code]=0;let vy=0;camera.position.set(0,3,0);let ray=new THREE.Raycaster(),center=new THREE.Vector2();(function anim(){requestAnimationFrame(anim);if(controls.isLocked){if(keys['KeyW'])controls.moveForward(.15);if(keys['KeyS'])controls.moveForward(-.15);if(keys['KeyA'])controls.moveRight(-.15);if(keys['KeyD'])controls.moveRight(.15);if(keys['Space']&&camera.position.y<2.2)vy=.18;vy-=.01;camera.position.y+=vy;if(camera.position.y<1.8){camera.position.y=1.8;vy=0;}}renderer.render(scene,camera);})();onmousedown=e=>{if(!controls.isLocked)return;ray.setFromCamera(center,camera);let hits=ray.intersectObjects(Object.values(world));if(!hits[0]||hits[0].distance>6)return;let p=hits[0].object.position;if(e.button==0)setBlock(Math.floor(p.x),Math.floor(p.y),Math.floor(p.z),null);else{let q=p.clone().add(hits[0].face.normal);setBlock(Math.floor(q.x),Math.floor(q.y),Math.floor(q.z),0x5aa82f);}};oncontextmenu=e=>e.preventDefault();</script></body></html>
